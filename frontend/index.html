    <!-- FAQ Page Structured Data for Google Search Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Is Retalyy a complete standalone financial ledger?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Retalyy is built as a complete, modern system of record with continuous bank sync, automated transaction drafting, and real-time reconciliation—eliminating the need for fragmented legacy accounting software."
          }
        },
        {
          "@type": "Question",
          "name": "How does Retalyy collaborate with my CPA or accounting firm?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Retalyy is built to empower your relationship with your CPA. We automate repetitive data entry, document extraction, and feed matching, delivering organized, source-cited records so your CPA can focus on tax strategy, advisory, and official sign-off."
          }
        },
        {
          "@type": "Question",
          "name": "How does Retalyy protect financial data and privacy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your financial data is protected by AES-256 encryption at rest and in transit, strict role-based access controls, and SOC 2-aligned security standards. We never sell your data or use private financial records to train public AI models."
          }
        },
        {
          "@type": "Question",
          "name": "Does Retalyy move funds or provide tax and audit opinions?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Retalyy is an operational financial software platform. We track bills and schedule payment reminders through your existing commercial bank rails, and we prepare structured records for your licensed CPA or tax professional to review and file."
          }
        },
        {
          "@type": "Question",
          "name": "Do I have to connect a bank account to start using Retalyy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Retalyy is optional-first. You can get started immediately without connecting a bank account or uploading a single document. Provide data however works best for you—via read-only bank feeds, statement uploads, spreadsheet imports, or email forwarding."
          }
        }
      ]
    }
